name: Feature request
description: Propose an improvement to CohortKit
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: How should CohortKit behave?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: How does this fit accelerator and incubator workflows?